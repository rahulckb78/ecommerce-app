services:
  - type: web
    name: ecommerce-smartbuy-app-2
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        value: https://ecommerce-smartbuy-app-2.onrender.com
      - key: CLIENT_URL
        value: https://ecommerce-smartbuy-app-2.onrender.com
